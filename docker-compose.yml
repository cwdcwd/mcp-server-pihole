version: '3.8'

services:
  pihole-mcp:
    build: .
    container_name: pihole-mcp-server
    environment:
      - PIHOLE_BASE_URL=${PIHOLE_BASE_URL}
      - PIHOLE_PASSWORD=${PIHOLE_PASSWORD}
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - mcp-network
    # For MCP gateway integration, we need to expose stdio
    stdin_open: true
    tty: true
    # Optional: if you need HTTP access for debugging
    ports:
      - "3000:3000"
    volumes:
      # Mount .env file if it exists
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('Health check passed')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  pihole-mcp-http-sidecar:
    profiles: [sidecar]
    build:
      context: .
      dockerfile: Dockerfile
    image: pihole-mcp-server:sidecar
    container_name: pihole-mcp-http-sidecar
    environment:
      NODE_ENV: production
      PIHOLE_MCP_TRANSPORT: http
      PIHOLE_BASE_URL: ${PIHOLE_MCP_TS_BASE_URL:?Set PIHOLE_MCP_TS_BASE_URL}
      PIHOLE_PASSWORD: ${PIHOLE_MCP_TS_PASSWORD:?Set PIHOLE_MCP_TS_PASSWORD}
      MCP_TOKEN: ${PIHOLE_MCP_TS_MCP_TOKEN:?Set PIHOLE_MCP_TS_MCP_TOKEN}
      PIHOLE_MCP_HTTP_HOST: 0.0.0.0
      PIHOLE_MCP_HTTP_PORT: ${PIHOLE_MCP_TS_HTTP_PORT:-3002}
      PIHOLE_MCP_ALLOWED_HOSTS: ${PIHOLE_MCP_TS_ALLOWED_HOSTS:?Set PIHOLE_MCP_TS_ALLOWED_HOSTS}
      PIHOLE_MCP_ALLOWED_ORIGINS: ${PIHOLE_MCP_TS_ALLOWED_ORIGINS:?Set PIHOLE_MCP_TS_ALLOWED_ORIGINS}
    restart: unless-stopped
    ports:
      - "${PIHOLE_MCP_TS_PUBLISH_ADDRESS:-127.0.0.1}:${PIHOLE_MCP_TS_HTTP_PORT:-3002}:${PIHOLE_MCP_TS_HTTP_PORT:-3002}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PIHOLE_MCP_HTTP_PORT + '/healthz', {headers:{host:process.env.PIHOLE_MCP_ALLOWED_HOSTS.split(',')[0].trim(),authorization:'Bearer ' + process.env.MCP_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  mcp-network:
    driver: bridge
